<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML/CSS QUIZ</h1>
    </header>
    <main>
        <form>
            <div class="form-item">
                <label for="q1">1. What HTML element is used to define an unordered
                    list?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2">2. Briefly explain the difference between padding and margin in
                    CSS:</label>
                <textarea id="q2" name="q2" rows="4"
                  placeholder="Type your answer here..."></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which CSS property is used to change the background color of
                    an
                    element?</label>
                <select name="q3" id="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="background-color">background-color</option>
                    <option value="color">color</option>
                    <option value="fill">fill</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. How many levels of heading elements (h1 to hX) exist in
                    HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
