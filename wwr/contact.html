<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AquaRush Rafting</title>
    <meta name="description"
      content="Get in touch with us for questions, reservations, or trip planning. Contact Whitewater Rafting today to book your next river adventure!">
    <meta name="author" content="Andres Sejas">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raftinglogo.png" alt="logo of our company" width="150">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>


        <div class="contacts">
            <h2>AquaRush Rafting</h2>
            <h3>123 San Pedro Street</h3>
            <h3>Coroico, La Paz</h3>
            <h3>+1 999 999 9999</h3>
            <h3>info@aquarush.com</h3>
        </div>
        <div class="mapandform">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d676.1598107195822!2d-67.61314512655011!3d-16.00953063471551!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x915f9d29976b5407%3A0x49a318bf56ed3a0b!2sSan%20Pedro%20de%20Caranavi!5e0!3m2!1ses-419!2sbo!4v1790909496959!5m2!1ses-419!2sbo"
              width="400" height="298" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <div class="column1">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>
                <div class="column1">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>
                <fieldset class="column1">
                    <legend>Message Purpose</legend>
                    <div class="options">
                        <label>
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <div class="ticket">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"
                      rows="4"></textarea>
                </div>

                <div class="check">
                    <label>
                        <input type="checkbox" name="subscribe" value="yes" checked>
                        Please Subscribe me to the monthyly newsletter
                    </label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="adventures">
                <figure>
                    <img src="images/employ1.jpg" alt="Picture of River manager">
                    <figcaption>River Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employ2.jpg" alt="Picture of Safety coordinador">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employ3.jpg" alt="Picture of Trip leader">
                    <figcaption>Trip Leader</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 🚣‍♀️ AquaRush Rafting 🚣‍♀️ Andres Sejas</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebookicon.svg" alt="Facebook Icon"
                  width="50"></a>
            <a href="https://linkedin.com"><img src="images/linkedinicon.svg" alt="Linkedin Icon"
                  width="50"></a>
            <a href="https://instagram.com"><img src="images/instagramicon.svg" alt="Instagram Icon"
                  width="50"></a>
        </nav>
    </footer>
</body>

</html>
